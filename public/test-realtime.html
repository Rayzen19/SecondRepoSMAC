<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Messaging Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            font-weight: bold;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .config {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
        }
        .config strong {
            color: #764ba2;
        }
        .message-log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            font-family: monospace;
            font-size: 13px;
        }
        .message-log .log-item {
            padding: 8px;
            margin: 5px 0;
            background: white;
            border-radius: 3px;
            border-left: 3px solid #667eea;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Real-Time Messaging Test</h1>
        
        <div class="config">
            <strong>Pusher Configuration:</strong><br>
            App Key: <span id="app-key">Loading...</span><br>
            Cluster: <span id="cluster">Loading...</span><br>
            Status: <span id="connection-status">Not connected</span>
        </div>

        <div id="status-container"></div>

        <div style="text-align: center; margin: 20px 0;">
            <button onclick="testConnection()">🔄 Test Connection</button>
            <button onclick="clearLogs()">🗑️ Clear Logs</button>
        </div>

        <div class="message-log" id="message-log">
            <div class="log-item">Waiting for events...</div>
        </div>
    </div>

    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <script>
        // REPLACE THESE WITH YOUR ACTUAL PUSHER CREDENTIALS
        const PUSHER_APP_KEY = 'dba9905142b420a31522';
        const PUSHER_APP_CLUSTER = 'ap1';

        document.getElementById('app-key').textContent = PUSHER_APP_KEY;
        document.getElementById('cluster').textContent = PUSHER_APP_CLUSTER;

        let pusher;
        let channel;

        function addStatus(message, type = 'info') {
            const container = document.getElementById('status-container');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            container.appendChild(div);
        }

        function addLog(message) {
            const log = document.getElementById('message-log');
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('message-log').innerHTML = '<div class="log-item">Logs cleared. Waiting for events...</div>';
        }

        function testConnection() {
            addStatus('<div class="spinner"></div> Testing Pusher connection...', 'info');
            addLog('Attempting to connect to Pusher...');

            try {
                if (pusher) {
                    pusher.disconnect();
                }

                pusher = new Pusher(PUSHER_APP_KEY, {
                    cluster: PUSHER_APP_CLUSTER,
                    forceTLS: true
                });

                pusher.connection.bind('connecting', function() {
                    addLog('⏳ Connecting to Pusher...');
                    document.getElementById('connection-status').textContent = 'Connecting...';
                });

                pusher.connection.bind('connected', function() {
                    addStatus('✅ Successfully connected to Pusher!', 'success');
                    addLog('✅ Connected successfully!');
                    document.getElementById('connection-status').textContent = 'Connected ✓';
                    document.getElementById('connection-status').style.color = 'green';
                });

                pusher.connection.bind('unavailable', function() {
                    addStatus('❌ Connection unavailable. Check your credentials.', 'error');
                    addLog('❌ Connection unavailable');
                    document.getElementById('connection-status').textContent = 'Unavailable ✗';
                    document.getElementById('connection-status').style.color = 'red';
                });

                pusher.connection.bind('failed', function() {
                    addStatus('❌ Connection failed. Check your credentials.', 'error');
                    addLog('❌ Connection failed');
                    document.getElementById('connection-status').textContent = 'Failed ✗';
                    document.getElementById('connection-status').style.color = 'red';
                });

                pusher.connection.bind('disconnected', function() {
                    addLog('⚠️ Disconnected from Pusher');
                    document.getElementById('connection-status').textContent = 'Disconnected';
                    document.getElementById('connection-status').style.color = 'orange';
                });

                pusher.connection.bind('error', function(err) {
                    addStatus('❌ Connection error: ' + JSON.stringify(err), 'error');
                    addLog('❌ Error: ' + JSON.stringify(err));
                });

                // Subscribe to a test channel
                addLog('📡 Subscribing to test channel...');
                channel = pusher.subscribe('test-channel');

                channel.bind('pusher:subscription_succeeded', function() {
                    addLog('✅ Subscribed to test-channel');
                });

                channel.bind('pusher:subscription_error', function(status) {
                    addLog('❌ Subscription error: ' + status);
                });

            } catch (error) {
                addStatus('❌ Error initializing Pusher: ' + error.message, 'error');
                addLog('❌ Initialization error: ' + error.message);
            }
        }

        // Auto-test on page load
        window.addEventListener('load', function() {
            addLog('🚀 Page loaded. Starting automatic connection test...');
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
